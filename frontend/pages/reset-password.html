<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset an authorized account password for the Calape Municipal Traffic Violation System.">
  <title>Reset Password | Calape Traffic Enforcement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../app-config.js"></script>
  <style>
    :root { color-scheme: light; --navy:#0b2545; --blue:#143f6b; --gold:#c9a227; --muted:#64748b; --border:#dbe3ec; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Manrope,Arial,sans-serif; color:#172033; background:radial-gradient(circle at top left,#e8f1f8,transparent 40%),linear-gradient(135deg,#f8fafc,#edf3f8); }
    .shell { width:min(100%,460px); }
    .brand { display:flex; gap:12px; align-items:center; justify-content:center; margin-bottom:18px; color:var(--navy); }
    .brand img { width:58px; height:58px; object-fit:contain; }
    .brand strong { display:block; font-size:15px; }
    .brand span { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:20px; padding:30px; box-shadow:0 24px 60px rgba(11,37,69,.12); }
    h1 { margin:0 0 8px; font-size:26px; color:var(--navy); }
    .intro { margin:0 0 24px; color:var(--muted); line-height:1.6; font-size:14px; }
    label { display:block; margin:15px 0 7px; font-size:13px; font-weight:700; color:#334155; }
    input { width:100%; border:1px solid #cbd5e1; border-radius:11px; padding:13px 14px; font:inherit; outline:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(20,63,107,.12); }
    .hint { color:var(--muted); font-size:12px; margin-top:7px; line-height:1.5; }
    button { width:100%; border:0; border-radius:11px; padding:13px 16px; margin-top:22px; background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.62; cursor:wait; }
    .notice { display:none; margin-top:16px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.5; }
    .notice.show { display:block; }
    .notice.error { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .notice.success { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .back { display:block; margin-top:18px; text-align:center; color:var(--blue); font-weight:700; font-size:13px; text-decoration:none; }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <img src="images/calape-logo.webp" alt="Municipality of Calape seal">
      <div><strong>Calape Traffic Enforcement</strong><span>Authorized personnel account recovery</span></div>
    </div>
    <section class="card" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Create a new password</h1>
      <p class="intro">Use the secure link sent to your registered email. The link expires one hour after it is issued.</p>
      <form id="resetForm" novalidate>
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" minlength="12" autocomplete="new-password" required>
        <div class="hint">Use at least 12 characters with a mix of uppercase, lowercase, number, and symbol.</div>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
        <button id="submitButton" type="submit">Reset Password</button>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
      </form>
      <a class="back" href="login.html">Return to officer login</a>
    </section>
  </main>
  <script src="../assets/js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('resetForm');
    const button = document.getElementById('submitButton');
    const notice = document.getElementById('notice');

    function showNotice(message, type) {
      notice.textContent = message;
      notice.className = `notice show ${type}`;
    }

    if (!token) {
      showNotice('This password-reset link is incomplete. Request a new link from the login page.', 'error');
      button.disabled = true;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (password.length < 12) return showNotice('Password must contain at least 12 characters.', 'error');
      if (!/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/\d/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
        return showNotice('Include uppercase, lowercase, number, and symbol.', 'error');
      }
      if (password !== confirmation) return showNotice('The passwords do not match.', 'error');

      button.disabled = true;
      button.textContent = 'Resetting password...';
      try {
        await API.resetPassword(token, password);
        form.reset();
        showNotice('Password reset successful. Redirecting to login...', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      } catch (error) {
        showNotice(error.message || 'Unable to reset the password. Request a new link.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
